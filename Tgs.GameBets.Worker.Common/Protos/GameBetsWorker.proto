// 注單狀態
enum BetState{
    //等待中: 我們交易員因為可能因為賠率的轉換等因素，還未接受這張注單。
    BET_STATE_WAITING = 0;
    //進行中: 此註單還沒有結算。 (注單還沒有結算的狀態有可能是這場比賽還沒有結算之類的情形。)
    BET_STATE_RUNNING = 1;
    //作廢: 在註單為 Running 的狀態下，玩家下註註金返回。原因可能為我們交易員對此場賽事有些疑慮。可與我們聯繫詢問發生什麼狀況。
    BET_STATE_VOID= 2;
    //退款: 在註單為 Running 的狀態下，玩家下註金返回。 原因有可能是賽事取消或發生什麼意外。
    BET_STATE_REFUND = 3;
    //已取消: 在註單為 Waiting 的狀態下，玩家下註金返回。 可能狀況很多。
    BET_STATE_CANCEL = 4;
    //輸: 此註單已結算且玩家輸了此註單。
    BET_STATE_LOSS = 5;
    //贏: 此註單已結算且玩家贏了此註單。
    BET_STATE_WIN = 6;
    //和局: 此註單已結算且此註單為和局。
    BET_STATE_DRAW = 7;
    //半贏: 此註單已結算且玩家贏了下注額一半。
    BET_STATE_HALF_WIN = 8;
    //半輸: 此註單已結算且玩家輸了下注額一半。
    BET_STATE_HALF_LOSS = 9;
}

// 注單類型
enum BetType {
    //正常
    BET_TYPE_NORMAL = 0;
}

// 免費遊戲狀態
enum FreeGameState{
    FREE_GAME_STATE_NONE = 0;
    FREE_GAME_STATE_FREE_GAME = 1;
}

// 博取遊戲
enum GambleState{
    GAMBLE_STATE_NONE = 0;
    GAMBLE_STATE_GAMBLE = 1;
}

// 兌現狀態
enum CashoutState{
    CASHOUT_STATE_NONE = 0;
    CASHOUT_STATE_CASHOUT = 1;
}

// 重新结算狀態
enum ResettleState{
    RESETTLE_STATE_NONE = 0;
    RESETTLE_STATE_RESETTLE = 1;
}

/// <summary>
/// 彩金狀態
/// </summary>
enum JackpotState{
	JACKPOT_STATE_NONE = 0;
	JACKPOT_STATE_JACKPOT = 1;
}

/// <summary>
/// 重置狀態
/// </summary>
enum ResetState{
	RESET_STATE_NONE = 0;
	RESET_STATE_RESET = 1;
}